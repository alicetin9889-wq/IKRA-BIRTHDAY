<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali'den İkra'ya</title>

<style>
body{
margin:0;
padding:0;
background:black;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

#container{
padding:20px;
animation:fade 2s;
}

h1{
font-size:40px;
margin-bottom:20px;
}

p{
font-size:20px;
line-height:1.6;
}

button{
padding:12px 25px;
border:none;
border-radius:20px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<div id="container">
<h1>✉️ Ali'den İkra'ya</h1>

<p id="text">
Bazı insanlar vardır...<br>
Konuşması bile insanın gününü değiştirir.
</p>

<button onclick="nextScene()">Devam Et</button>
</div>

<script>

let step = 0;

function nextScene(){

const text = document.getElementById("text");

step++;

if(step == 1){
text.innerHTML = `
“sağol alisimm” 💞<br><br>
“sen dinlen ali”<br><br>
“sende alim”
`;
}

else if(step == 2){
text.innerHTML = `
Sanırım bazı insanlar<br>
beklenmedik şekilde değerli oluyor.
`;
}

else if(step == 3){
text.innerHTML = `
🎂 İyi ki doğdun İkra.<br><br>
Ve lütfen Ali'yi üzme.<br><br>
— Dr. Jack Shephard
`;
}

}

</script>

</body>
</html>
